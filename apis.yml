name: Tenzai
description: >-
  Tenzai is an AI-native cybersecurity company building an autonomous, agentic AI
  "hacker" for the enterprise. Its AI agents continuously discover, chain, and exploit
  hard-to-find vulnerabilities across enterprise software and validate them in production
  the way a human red team would, aiming to bring nation-grade offensive security to
  every engineering organization. Founded in 2025 by Guardicore founders Pavel Gurvich
  and Ariel Zeitlin together with Ofri Ziv, Itamar Tal, and Aner Mazur, the Tel Aviv-based
  company launched out of stealth in November 2025 with a $75M seed round (one of the
  largest in cybersecurity) led by Greylock Partners, Battery Ventures, and Lux Capital
  at a reported $330M valuation. Tenzai targets the penetration-testing market with
  continuous, AI-driven offensive validation. As of this profile the company exposes a
  marketing site, a research blog, careers, and a SOC 2 Type 1 trust center, but no
  public developer or API surface.
